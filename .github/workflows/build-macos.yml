name: Build macOS Portable Application

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web Assets (Vite)
        run: npm run build

      - name: Package macOS App (.dmg and .zip)
        run: npx electron-builder --mac --arm64 --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS Artifacts (.dmg and .zip)
        uses: actions/upload-artifact@v4
        with:
          name: SitePunch-macOS-Application
          path: |
            release/*.dmg
            release/*.zip
          retention-days: 30
